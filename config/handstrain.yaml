SeriaNumber: 4
Name: HandStrain
AssessmentName: HandStrain

Colors:
  black: &black
    rgba(15, 15, 30, 0.9)

  light_green: &light_green
    rgba(109, 208, 163, 1.0)

  green: &green
   rgba(20, 210, 184, 1.0)

  orange: &orange
    rgba(234, 130, 130, 1.0)

  red: &red
    rgba(184, 15, 10, 1.0)

Constants:
  unsafe: &unsafe
    Value: Unsafe
    Color: *red

  acceptable: &acceptable
    Value: Good
    Color: *light_green

  low: &low
    Value: Fair
    Color: *orange

  medium: &medium
    Value: Poor
    Color: *red

Enum:
  Multipliers:
    durationPerExertionLeft:
      Value: dml
      Label: Duration multiplier (left)
    durationPerExertionRight:
      Value: dmr
      Label: Duration multiplier (right)
    flexionAngleLeft:
      Value: pml
      Label: Posture multiplier (left)
    flexionAngleRight:
      Value: pml
      Label: Posture multiplier (right)
    extensionAngleLeft:
      Value: pml
      Label: Posture multiplier (left)
    extensionAngleRight:
      Value: pmr
      Label: Posture multiplier (right)
    effortsLeft:
      Value: eml
      Label: Effort multiplier (left)
    effortsRight:
      Value: emr
      Label: Effort multiplier (right)

OverallScoreValue: OverallScore

Metadata: {}

ResultValues:
  OverallScore:
    Label: Overall Score
    Values:
      "[0, 10]":
        Label: Good
        Score: *acceptable
      "[10, None]":
        Label: Poor
        Warning: Job needs to be redesigned
        Score: *medium

  resultLeft:
    Label: Result Left
    Values:
      "[0, 10]":
        Label: Good
        Score: *acceptable
      "[10, None]":
        Label: Poor
        Warning: Job needs to be redesigned
        Score: *medium

  resultRight:
    Label: Result Right
    Values:
      "[0, 10]":
        Label: Good
        Score: *acceptable
      "[10, None]":
        Label: Poor
        Warning: Job needs to be redesigned
        Score: *medium

  im:
    Label: Intensity
    Values:
      "[0, 5]":
        Label: Good
        Score: *acceptable
      "[5, 15]":
        Label: Fair
        Warning: Job has high level of intensity
        Score: *low
      "[15, None]":
        Label: Poor
        Warning: Job has very high level of intensity
        Score: *medium

  eml:
    Label: Efforts per minute (left)
    Values:
      "[0, 5]":
        Label: Good
        Score: *acceptable
      "[5, 10]":
        Label: Fair
        Warning: High level of repetition on left hand
        Score: *low
      "[10, None]":
        Label: Poor
        Warning: Very high level of repetition on left hand
        Score: *medium

  pml:
    Label: Hand posture (left)
    Values:
      "[0, 1.5]":
        Label: Good
        Score: *acceptable
      "[1.5, 2]":
        Label: Fair
        Warning: Lefthand posture OK
        Score: *low
      "[2, None]":
        Label: Poor
        Warning: Lefthand posture bad
        Score: *medium

  dml:
    Label: Duration per repetition (left)
    Values:
      "[0, 7.5]":
        Label: Good
        Score: *acceptable
      "[7.5, 15]":
        Label: Fair
        Warning: Each repetition has high duration on left hand
        Score: *low
      "[15, None]":
        Label: Poor
        Warning: Each repetition has very high duration on left hand
        Score: *medium

  wm:
    Label: Workday multiplier
    Values:
      "[0, .5]":
        Label: Good
        Score: *acceptable
      "[.5, 1]":
        Label: Fair
        Warning: Job should be done for shorter period
        Score: *low
      "[1, None]":
        Label: Poor
        Warning: Job should be done for shorter period
        Score: *medium

  emr:
    Label: Efforts per minute (right)
    Values:
      "[0, 5]":
        Label: Good
        Score: *acceptable
      "[5, 10]":
        Label: Fair
        Warning: High level of repetition on left hand
        Score: *low
      "[10, None]":
        Label: Poor
        Warning: Very high level of repetition on left hand
        Score: *medium

  pmr:
    Label: Hand posture (right)
    Values:
      "[0, 1.5]":
        Label: Good
        Score: *acceptable
      "[1.5, 2]":
        Label: Fair
        Warning: Righthand posture OK
        Score: *low
      "[2, None]":
        Label: Poor
        Warning: Righthand posture bad
        Score: *medium

  dmr:
    Label: Duration per repetition (right)
    Values:
      "[0, 7.5]":
        Label: Good
        Score: *acceptable
      "[7.5, 15]":
        Label: Fair
        Warning: Each repetition has high duration on left hand
        Score: *low
      "[15, None]":
        Label: Poor
        Warning: Each repetition has very high duration on left hand
        Score: *medium

RiskComponents:
  Main:
    durationPerExertionLeft:
      Type: input
      Base: .5
      MaxInput: 50
      Units: sec./exertion
      Label: Duration per exertion (left)
      Image: bodyParts/wrist.png
      Values:
        "[0, 10]":
          Label: Good
          Score: *acceptable
        "[10, 20]":
          Label: Fair
          Warning: Duration per exertion (left)
          Score: *low
        "[20, None]":
          Label: Poor
          Warning: Each repetition has very high duration on left hand
          Score: *medium
    durationPerExertionRight:
      Type: input
      Base: .5
      MaxInput: 50
      Units: sec./exertion
      Label: Duration per exertion (right)
      Image: bodyParts/wrist.png
      Values:
        "[0, 10]":
          Label: Good
          Score: *acceptable
        "[10, 20]":
          Label: Fair
          Warning: Each repetition has high duration on right hand
          Score: *low
        "[20, None]":
          Label: Poor
          Warning: Each repetition has very high duration on right hand
          Score: *medium
    flexionAngleLeft:
      Type: input
      Base: 0
      MaxInput: 50
      Units: degrees
      Label: Wrist posture angle (left)
      Image: bodyParts/wrist.png
      Values:
        "[0, 10]":
          Label: Good
          Score: *acceptable
        "[10, 20]":
          Label: Fair
          Warning: Wrist posture angle (left)
          Score: *low
        "[20, None]":
          Label: Poor
          Warning: Left wrist repeatedly flexing/extending at a high level
          Score: *medium
    flexionAngleRight:
      Type: input
      Base: 0
      MaxInput: 50
      Units: degrees
      Label: Wrist posture angle (right)
      Image: bodyParts/wrist.png
      Values:
        "[0, 10]":
          Label: Good
          Score: *acceptable
        "[10, 20]":
          Label: Fair
          Warning: Right wrist repeatedly flexing/extending
          Score: *low
        "[20, None]":
          Label: Poor
          Warning: Right wrist repeatedly flexing/extending at a high level
          Score: *medium
    extensionAngleLeft:
      Type: input
      Base: 0
      MaxInput: 50
      Units: degrees
      Label: Extension Wrist angle (left)
      Image: bodyParts/wrist.png
      Values:
        "[0, 10]":
          Label: Good
          Score: *acceptable
        "[10, 20]":
          Label: Fair
          Warning: Left wrist repeatedly flexing/extending
          Score: *low
        "[20, None]":
          Label: Poor
          Warning: Left wrist repeatedly flexing/extending at a high level
          Score: *medium
    extensionAngleRight:
      Type: input
      Base: 0
      MaxInput: 50
      Units: degrees
      Label: Extension Wrist angle (right)
      Image: bodyParts/wrist.png
      Values:
        "[0, 10]":
          Label: Good
          Score: *acceptable
        "[10, 20]":
          Label: Fair
          Warning: Right wrist repeatedly flexing/extending
          Score: *low
        "[20, None]":
          Label: Poor
          Warning: Right wrist repeatedly flexing/extending at a high level
          Score: *medium
    effortsLeft:
      Type: input
      Base: 5
      MaxInput: 50
      Units: efforts/min
      Label: Efforts per hand (left)
      Image: bodyParts/wrist.png
      Values:
        "[0, 10]":
          Label: Good
          Score: *acceptable
        "[10, 20]":
          Label: Fair
          Warning: Left wrist exerting force frequently
          Score: *low
        "[20, None]":
          Label: Poor
          Warning: Left wrist exerting force highly frequently
          Score: *medium
    effortsRight:
      Type: input
      Base: 5
      MaxInput: 50
      Units: efforts/min
      Label: Efforts per hand (right)
      Image: bodyParts/wrist.png
      Values:
        "[0, 10]":
          Label: Good
          Score: *acceptable
        "[10, 20]":
          Label: Fair
          Warning: Right wrist exerting force frequently
          Score: *low
        "[20, None]":
          Label: Poor
          Warning: Right wrist exerting force highly frequently
          Score: *medium

