constants:
  black: &black
    Color: rgba(15, 15, 30, 0.9)

  light_green: &light_green
    Color: rgba(109, 208, 163, 1.0)

  green: &green
    Color: rgba(20, 210, 184, 1.0)

  orange: &orange
    Color: rgba(234, 130, 130, 1.0)

  red: &red
    Color: rgba(184, 15, 10, 1.0)

  unsafe: &unsafe
    TranslateText: handstrain.risk.unacceptable
    ShortText: Unsafe
    <<: *black
  acceptable: &good
    TranslateText: handstrain.risk.good
    ShortText: Good
    <<: *light_green
  low: &fair
    TranslateText: handstrain.risk.fair
    ShortText: Fair
    <<: *orange
  medium: &poor
    TranslateText: handstrain.risk.poor
    ShortText: Poor
    <<: *red

AdditionalInputsScores:
  5: &five
    1:
      <<: *good
    3:
      <<: *fair
    5:
      <<: *fair
    7:
      <<: *poor
    9:
      <<: *poor

ResultValues:
  OverallScore:
    "[0, 10]":
      Text: Safe job for upper extremity
      <<: *good
      Warning: ~
    "[10, None]":
      Text: Unsafe job for upper extremity
      <<: *poor
      Warning: Job needs to be redesigned

  resultLeft:
    "[0, 10]":
      Text: Safe job for upper extremity
      <<: *good
      Warning: ~
    "[10, None]":
      Text: Unsafe job for upper extremity
      <<: *poor
      Warning: Job needs to be redesigned

  resultRight:
    "[0, 10]":
      Text: Safe job for upper extremity
      <<: *good
      Warning: ~
    "[10, None]":
      Text: Unsafe job for upper extremity
      <<: *poor
      Warning: Job needs to be redesigned

  im:
    "[0, 5]":
      <<: *good
      Warning: ~
    "[5, 15]":
      <<: *fair
      Warning: Job has high level of intensity
    "[15, None]":
      <<: *poor
      Warning: Job has very high level of intensity

  eml:
    "[0, 5]":
      <<: *good
      Warning: ~
    "[5, 10]":
      <<: *fair
      Warning: High level of repetition on left hand
    "[10, None]":
      <<: *poor
      Warning: Very high level of repetition on left hand

  pml:
    "[0, 1.5]":
      <<: *good
      Warning: ~
    "[1.5, 2]":
      <<: *fair
      Warning: Lefthand posture OK
    "[2, None]":
      <<: *poor
      Warning: Lefthand posture bad

  dml:
    "[0, 7.5]":
      <<: *good
      Warning: ~
    "[7.5, 15]":
      <<: *fair
      Warning: Each repetition has high duration on left hand
    "[15, None]":
      <<: *poor
      Warning: Each repetition has very high duration on left hand

  wm:
    "[0, .5]":
      <<: *good
      Warning: ~
    "[.5, 1]":
      <<: *fair
      Warning: Job should be done for shorter period
    "[1, None]":
      <<: *poor
      Warning: Job should be done for shorter period

  emr:
    "[0, 5]":
      <<: *good
      Warning: ~
    "[5, 10]":
      <<: *fair
      Warning: High level of repetition on left hand
    "[10, None]":
      <<: *poor
      Warning: Very high level of repetition on left hand

  pmr:
    "[0, 1.5]":
      <<: *good
      Warning: ~
    "[1.5, 2]":
      <<: *fair
      Warning: Righthand posture OK
    "[2, None]":
      <<: *poor
      Warning: Righthand posture bad

  dmr:
    "[0, 7.5]":
      <<: *good
      Warning: ~
    "[7.5, 15]":
      <<: *fair
      Warning: Each repetition has high duration on left hand
    "[15, None]":
      <<: *poor
      Warning: Each repetition has very high duration on left hand

ComponentValues:
  durationPerExertionLeft:
    "[0, 10]":
      <<: *good
      Warning: ~
    "[10, 20]":
      <<: *fair
      Text: Duration per exertion (left)
      Warning: Each repetition has high duration on left hand
    "[20, None]":
      <<: *poor
      Text: Duration per exertion (left)
      Warning: Each repetition has very high duration on left hand
    Base: .5
    Max: 50
    Multiplier: "dml"
    label: Duration per exertion (left)
    ShortLabel: duration (l)
    Units: sec./exertion
    type: input
  durationPerExertionRight:
    "[0, 10]":
      <<: *good
      Warning: ~
    "[10, 20]":
      <<: *fair
      Text: Duration per exertion (right)
      Warning: Each repetition has high duration on right hand
    "[20, None]":
      <<: *poor
      Text: Duration per exertion (right)
      Warning: Each repetition has very high duration on right hand
    Base: .5
    Max: 50
    Multiplier: "dmr"
    label: Duration per exertion (right)
    ShortLabel: duration (r)
    Units: sec./exertion
    type: input
  flexionAngleLeft:
    "[0, 10]":
      <<: *good
      Warning: ~
    "[10, 20]":
      <<: *fair
      Text: Wrist posture angle (left)
      Warning: Left wrist repeatedly flexing/extending
    "[20, None]":
      <<: *poor
      Text: Wrist posture angle (left)
      Warning: Left wrist repeatedly flexing/extending at a high level
    Base: 0
    Max: 50
    Multiplier: "pml"
    label: Flexion Wrist angle (left)
    ShortLabel: posture (l)
    Units: degrees
    type: input
  flexionAngleRight:
    "[0, 10]":
      <<: *good
      Warning: ~
    "[10, 20]":
      <<: *fair
      Text: Wrist posture angle (right)
      Warning: Right wrist repeatedly flexing/extending
    "[20, None]":
      <<: *poor
      Text: Wrist posture angle (right)
      Warning: Right wrist repeatedly flexing/extending at a high level
    Base: 0
    Max: 50
    Multiplier: "pmr"
    label: Flexion Wrist angle (right)
    ShortLabel: posture (r)
    Units: degrees
    type: input
  extensionAngleLeft:
    "[0, 10]":
      <<: *good
      Warning: ~
    "[10, 20]":
      <<: *fair
      Text: Wrist posture angle (left)
      Warning: Left wrist repeatedly flexing/extending
    "[20, None]":
      <<: *poor
      Text: Wrist posture angle (left)
      Warning: Left wrist repeatedly flexing/extending at a high level
    Base: 0
    Max: 50
    Multiplier: "pml"
    label: Extension Wrist angle (left)
    ShortLabel: posture (l)
    Units: degrees
    type: input
  extensionAngleRight:
    "[0, 10]":
      <<: *good
      Warning: ~
    "[10, 20]":
      <<: *fair
      Text: Wrist posture angle (right)
      Warning: Right wrist repeatedly flexing/extending
    "[20, None]":
      <<: *poor
      Text: Wrist posture angle (right)
      Warning: Right wrist repeatedly flexing/extending at a high level
    Base: 0
    Max: 50
    Multiplier: "pmr"
    label: Extension Wrist angle (right)
    ShortLabel: posture (r)
    Units: degrees
    type: input
  effortsLeft:
    "[0, 10]":
      <<: *good
      Warning: ~
    "[10, 20]":
      <<: *fair
      Text: Efforts per hand (left)
      Warning: Left wrist exerting force frequently
    "[20, None]":
      <<: *poor
      Text: Efforts per hand (left)
      Warning: Left wrist exerting force highly frequently
    Base: 5
    Max: 50
    Multiplier: "eml"
    label: Efforts per hand (left)
    ShortLabel: efforts (l)
    Units: efforts/min
    type: input
  effortsRight:
    "[0, 10]":
      <<: *good
      Warning: ~
    "[10, 20]":
      <<: *fair
      Text: Efforts per hand (right)
      Warning: Right wrist exerting force frequently
    "[20, None]":
      <<: *poor
      Text: Efforts per hand (right)
      Warning: Right wrist exerting force highly frequently
    Base: 5
    Max: 50
    Multiplier: "emr"
    label: Efforts per hand (right)
    ShortLabel: efforts (r)
    Units: efforts/min
    type: input

AdditionalInputs:
  borgScale:
    1:
      Text: Light
      TranslateText: handstrain.risk.light
      Warning: ~
      TranslateWarning: ~
    3:
      Text: Somewhat hard
      TranslateText: handstrain.risk.somewhat-hard
      Warning: ~
      TranslateWarning: ~
    5:
      Text: Hard
      TranslateText: handstrain.risk.hard
      Warning: Hard
      TranslateWarning: handstrain.risk.hard
    7:
      Text: Very hard
      TranslateText: handstrain.risk.very-hard
      Warning: Extreme physical effort
      TranslateWarning: handstrain.risk.extreme-effort
    9:
      Text: Maximal
      TranslateText: handstrain.risk.maximal
      Warning: Maximal exertion
      TranslateWarning: handstrain.risk.maximal-exertion
    label: Borg scale
    type: select
    Base: 1
    Image: ~
    Score: *five
  taskDuration:
    Base: 1
    type: input
    label: Task duration
    Max: 10
    Units: hrs
    Image: ~
