          Score: *medium
        0:
          Label: No
          Score: *acceptable
    ChairPanDepth: &ChairPanDepth
      Type: select
      Base: 1
      MaxInput: ~
      Units: ~
      Label: Pan depth
      Image: ~
      Values:
        1:
          Label: Normal seat pan
          Desc: 3’ between knee and edge of seat
          FullDesc: Approximately 3 inches of space between knee and edge of seat
          ImageDesc: 3 inches
          Score: *acceptable
        2:
          Label: Short seat pan
          Warning: Pressure may concentrate on the upper legs and buttocks, leading to discomfort
          Desc: < 3’ between knee and edge of seat
          FullDesc: Less than 3 inches of space between knee and edge of seat
          ImageDesc: <3 inches
          Score: *medium
        2.1:
          Label: Long seat pan
          Warning: May lead to increased pressure on the back of the thighs and reduced blood circulation
          Desc: "> 3’ between knee and edge of seat"
          FullDesc: More than 3 inches of space between knee and edge of seat
          ImageDesc: ">3 inches"
          Score: *medium
