    Color: *red
  unsafe: &unsafe
    Value: Unsafe
    Color: *red
  acceptable: &acceptable
    Value: Good
    Color: *light_green
  low: &low
    Value: Fair
    Color: *orange
  medium: &medium
    Value: Poor
    Color: *red

Enum:
  CouplingStatus:
    GOOD: 
      Value: 0
      Label: With handles
    POOR:
      Value: 1
      Label: Poor handles
    WITHOUT:
      Value: 2
      Label: Without handles

  InputId:
    1: 
      Value: 1
      Label: Lift
    2:
      Value: 2
      Label: Lower
    3:
      Value: 3
      Label: Push
    4:
      Value: 4
      Label: Pull
    5:
      Value: 5
      Label: Carry

OverallScoreValue: mal

