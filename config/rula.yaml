        0:
          Label: No
          Score: *acceptable
    LegSuddenExertion:
      Type: checkbox
      Base: 0
      MaxInput: ~
      Units: ~
      Label: Leg Sudden Exertion
      Image: additionalInputs/LegForceLoad.png
      TooltipText: Legs are usually the most affected by sudden exertion
      Values:
