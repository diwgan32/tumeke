        1:
          Label: 0°
          Image: angleIcons/rulaReba/Wrist_0_deg@2x.png
        2:
          Label: 15° up - 15° down
          Image: angleIcons/rulaReba/Wrist_15_15_Deg@2x.png
          Warning: Wrist bent
        3:
          Label: 15°+ up OR 15°+ down
          Image: angleIcons/rulaReba/Wrist_15+Up_Deg@2x.png
          Image2: angleIcons/rulaReba/Wrist_15+Down_Deg@2x.png
          Warning: Wrist far too bent
    Twist:
      Type: boolean
      Base: 0
      MaxInput: ~
      Units: ~
      Label: Twisted
      Image: ~
      Values:
        1:
          Label: Yes
          Image: angleIcons/rulaReba/Wrist_twisted_palm_down@2x.png
          Image2: angleIcons/rulaReba/Wrist_twisted_palm_up@2x.png
        0:
          Label: No
    Midline:
      Type: boolean
      Base: 0
      MaxInput: ~
      Units: ~
      Label: Wrist bent from midline
      Image: ~
      Values:
        1:
          Label: Yes
          Image: angleIcons/rulaReba/Wrist_bent_from_midline@2x.png
        0:
          Label: No

AdditionalInputs:
  Force:
    Arm:
      Type: select
      Base: 0
      MaxInput: ~
      Units: [lbs, kgs]
      Label: Arm Force
      Image: additionalInputs/ArmForceLoad.png
      Values:
        0:
          Label: < 1.8 kg
          Score: *acceptable
        1:
          Label: 1.8 kg - 10 kg
          Score: *medium
        2:
          Label: "> 10 kg"
          Warning: To much weight for an arm
          Score: *high
    Leg:
      Type: select
      Base: 0
      MaxInput: ~
      Units: [lbs, kgs]
